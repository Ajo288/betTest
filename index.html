<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="./css/main.css">
    <script src="./js/config.js"></script>
</head>

<body>

<!-- Auth check + logout setup — all in one module so order is guaranteed -->
<script type="module">
    import { initAuth, requireAuth } from "./js/auth.js";

    await initAuth();   // exchange code → token (async, waits for localStorage.setItem)
    requireAuth();      // redirect to login.html if still no token

    // Logout button — set up here AFTER auth is confirmed
    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("token");
        localStorage.removeItem("authType");
        window.location.href = "./login.html";
    });
</script>

<div class="logout-container">
    <button id="logoutBtn">Odhlásiť</button>
</div>

<h1>Tipovačka MS v hokeji 2026</h1>
<h2>Prehlad ziskanych bodov</h2>

<header class="header">
    <nav id="user-nav">
    </nav>
</header>

<table id="leaderboard">
    <thead>
    <tr>
        <th>Name</th>
        <th>Points</th>
    </tr>
    </thead>
    <tbody id="leaderboard-body">
    <!-- Rows will be inserted by JavaScript -->
    </tbody>
</table>

<script type="module" src="js/leaderboard.js"></script>
<script type="module" src="js/recipients.js"></script>
</body>
</html>
