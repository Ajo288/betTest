<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Prihlásenie</title>
    <link rel="stylesheet" href="./css/main.css">
    <script src="./js/config.js"></script>
</head>
<body>

<!--------Log-in-------->
<div class="login-container">
    <h2>Prihlásenie</h2>

    <form id="loginForm">
        <input class="simpleInput" type="text" id="username" placeholder="Používateľské meno" required>
        <input class="simpleInput" type="password" id="password" placeholder="Heslo" required>

        <!-- 🔽 TU JE NOVÁ VEC -->
        <select id="loginType" class="simpleInput">
            <option value="user">User (Keycloak)</option>
            <option value="admin">Admin (Basic)</option>
        </select>

        <button class="simpleBtn" type="submit">Prihlásiť</button>
        <p id="error" class="error"></p>
    </form>
</div>
<script src="js/login.js" type="module"></script>

<!--------Sign-in-------->
<div class="logout-container">
    <a href="./register.html">
        <button class="simpleBtn">Registrácia</button>
    </a>
</div>
</body>
</html>
